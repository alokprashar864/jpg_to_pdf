name: "🐛 Bug Report"
description: "File an issue to help us reproduce, track, and resolve bugs."
title: "[BUG]: "
labels: ["type: bug", "status: needs review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide as much detail as possible to help us quickly identify and reproduce the bug.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I upload an image over 50MB, the conversion stops unexpectedly..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the architecture is affected?
      options:
        - "Frontend (Next.js / UI / Canvas)"
        - "Local WASM Engine (Client-side)"
        - "Backend API Gateway (NestJS)"
        - "Worker Daemon (Go / pdfcpu / govips)"
        - "Storage & Infrastructure (Cloudflare R2 / MinIO / Redis / Docker)"
        - "Documentation / Build Tooling"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Drag and drop file 'example.jpg'
        3. Select 'A4' and 'Small Margins'
        4. Click 'Convert to PDF'
        5. See error message '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser version, OS, Node version, Docker version, etc.
      placeholder: "Chrome 125, Windows 11, Node.js 20.11"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any browser console errors, docker logs, or backend terminal outputs.
      render: shell
