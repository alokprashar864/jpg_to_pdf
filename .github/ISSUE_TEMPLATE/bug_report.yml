name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please verify the following before submitting
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I am using the latest version of the application
          required: true
        - label: I have reproduced the issue on the live demo or local development environment
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the platform is affected?
      options:
        - Frontend (Next.js / React / WASM)
        - Backend API (NestJS / Prisma / PostgreSQL)
        - Worker Service (Go / pdfcpu / govips)
        - Infrastructure (Docker / Redis / Cloudflare R2)
        - CI/CD / GitHub Actions
        - Documentation
      default: 0
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How critical is this issue?
      options:
        - P0 - Critical (Production down, data loss, security vulnerability)
        - P1 - High (Major feature broken, significant user impact)
        - P2 - Medium (Minor feature broken, workaround exists)
        - P3 - Low (Cosmetic, minor inconvenience)
      default: 2
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Details about your environment
      placeholder: |
        - OS: [e.g., Windows 11, macOS 14, Ubuntu 22.04]
        - Browser: [e.g., Chrome 120, Firefox 121, Safari 17]
        - Node.js version: [e.g., 20.10.0]
        - Go version: [e.g., 1.21.5]
        - Docker version: [e.g., 24.0.7]
        - Deployment: [Local / Vercel / Render / Production]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs & Error Messages
      description: Paste relevant logs, error messages, or stack traces
      placeholder: |
        Error: [paste error here]
        Stack trace: [paste stack trace here]
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Recordings
      description: If applicable, add screenshots or screen recordings to help explain the problem

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information, configuration, or data that might help resolve the issue