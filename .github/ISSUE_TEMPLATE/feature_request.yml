name: "💡 Feature Request"
description: "Suggest an idea or new capability for the JPG to PDF platform."
title: "[FEATURE]: "
labels: ["type: feature", "status: needs review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide clear details and problem context.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / User Need
      description: Is your feature request related to a problem or limitation?
      placeholder: "I'm always frustrated when government portals reject PDFs larger than 200KB..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature Idea
      description: Describe the solution or user experience you'd like to see.
      placeholder: "Add a preset slider allowing users to specify max file size (e.g. 200KB) using binary search compression..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Relevant Area
      options:
        - "Frontend (UI / UX / Canvas)"
        - "Client WASM Engine"
        - "Backend API / Database"
        - "Go Worker Engine"
        - "Cloud Infrastructure & S3/R2"
    validations:
      required: true
